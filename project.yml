name: Lingleaf
options:
  bundleIdPrefix: app.lingleaf
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  LingleafCore:
    path: LingleafCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Lingleaf:
    type: application
    platform: iOS
    sources:
      - path: Lingleaf
        # The stories' CC0 license stays in the repository (README); the app needs only the texts.
        excludes:
          - Resources/Books/LICENSE
    dependencies:
      - package: LingleafCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lingleaf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lingleaf
        # Only HTTPS and on-device translation: exempt from export documentation.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  LingleafUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LingleafUITests
    dependencies:
      - target: Lingleaf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lingleaf
schemes:
  Lingleaf:
    build:
      targets:
        Lingleaf: all
    test:
      targets:
        - LingleafUITests
