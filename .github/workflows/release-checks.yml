name: Release checks

# Only on pull requests to main (releases and hotfixes), so develop isn't blocked
# while the maintainer decides. Make "Release checks" a required check on main.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  privacy:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The privacy policy has no placeholders
        run: |
          # A placeholder like "[MAINTAINER NAME]" (capitals in brackets, not a Markdown link).
          if grep -nE '\[[A-Z][A-Z ]+\]([^(]|$)' PRIVACY.md; then
            echo "::error file=PRIVACY.md::Fill in the placeholder before releasing."
            exit 1
          fi
          echo "PRIVACY.md has no placeholders."
