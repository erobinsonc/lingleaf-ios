name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    # Needs GitHub code security, free for public repositories.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    # Code scanning is free for public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Same Xcode as the app build and TestFlight; older SDKs lack the iOS 26 APIs the app uses.
      - uses: ./.github/actions/use-xcode-26
      # Install and generate before CodeQL starts tracing: Homebrew refuses to run
      # under the tracer ("Cannot install under Rosetta 2").
      - run: |
          brew install xcodegen
          xcodegen generate
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
      - run: |
          xcodebuild build -project Lingleaf.xcodeproj -scheme Lingleaf -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v3
