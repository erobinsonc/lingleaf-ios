name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    # Needs GitHub code security, free for public repositories.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    # Code scanning is free for public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Same Xcode as the app build and TestFlight; older SDKs lack the iOS 26 APIs the app uses.
      - uses: ./.github/actions/use-xcode-26
      # Install and generate before CodeQL starts tracing: Homebrew refuses to run
      # under the tracer ("Cannot install under Rosetta 2").
      - run: |
          brew install xcodegen
          xcodegen generate
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: swift
          build-mode: manual
      - run: |
          xcodebuild build -project Lingleaf.xcodeproj -scheme Lingleaf -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
